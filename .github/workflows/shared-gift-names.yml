name: shared gift-names

# ギフト名日本語辞書（shared/gift-names）の正本と、各プロジェクトへの配布コピーが
# 一致しているかを見る。pre-commit でも同じチェックが走るが、
# hooksPath を設定していない環境からの push を通してしまうのでCI側にも置く。
#
# モノレポなので paths で対象を必ず絞る。
on:
  push:
    paths:
      - "shared/gift-names/**"
      - "live-sidestage-desktop/backend/lib/gift-names/**"
      - "live-sidestage-mobile/assets/gift_names/**"
      - ".github/workflows/shared-gift-names.yml"
  pull_request:
    paths:
      - "shared/gift-names/**"
      - "live-sidestage-desktop/backend/lib/gift-names/**"
      - "live-sidestage-mobile/assets/gift_names/**"
      - ".github/workflows/shared-gift-names.yml"

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # sync.mjs は Node 標準モジュールだけで動く。npm install は要らない。
      - name: 正本と配布コピーの整合を確認
        run: node shared/gift-names/sync.mjs --check
