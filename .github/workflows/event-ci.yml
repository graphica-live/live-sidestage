name: event CI

# モノレポなので paths で対象プロジェクトを必ず絞る。
# 絞らないと他4プロジェクトの push でも発火する。
on:
  push:
    paths:
      - "live-sidestage-event/**"
      - ".github/workflows/event-ci.yml"
  pull_request:
    paths:
      - "live-sidestage-event/**"
      - ".github/workflows/event-ci.yml"

defaults:
  run:
    working-directory: live-sidestage-event

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: live-sidestage-event/package-lock.json

      - run: npm ci

      - run: npx prisma generate

      - run: npm run typecheck

      - run: npm run test:unit

      # ビルドは DB に接続しないが、Prisma Client の初期化に URL の形式だけ要る。
      - run: npx next build
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=event"
          NEXTAUTH_SECRET: "ci-build-only"
