name: analytics CI

# モノレポなので paths で対象プロジェクトを必ず絞る。
# 絞らないと他4プロジェクトの push でも発火する。
#
# イベント機能(旧 live-sidestage-event)は live-sidestage-analytics へ統合したので、
# このワークフローが両方を検証する。
on:
  push:
    paths:
      - "live-sidestage-analytics/**"
      - ".github/workflows/analytics-ci.yml"
  pull_request:
    paths:
      - "live-sidestage-analytics/**"
      - ".github/workflows/analytics-ci.yml"

defaults:
  run:
    working-directory: live-sidestage-analytics

jobs:
  verify:
    runs-on: ubuntu-latest

    # integration テストは実DBを使う(スナップショット集計・advisory lock・
    # public と event をまたぐ結合は、モックでは意味のある検証にならない)。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: liveanalytics
          POSTGRES_PASSWORD: liveanalytics
          POSTGRES_DB: liveanalytics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U liveanalytics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://liveanalytics:liveanalytics@localhost:5432/liveanalytics_test"
      NEXTAUTH_SECRET: "ci-only"
      WORKER_COUNT: "1"
      WORKER_INDEX: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: live-sidestage-analytics/package-lock.json

      - run: npm ci

      - run: npx prisma generate

      - run: npm run typecheck

      - run: npm run test:unit

      # public と event の両スキーマを作る(multiSchema なのでスキーマ自体も push が作る)。
      - run: npx prisma db push --skip-generate

      # test:integration は .env.local.test を読む script なので、CI では直接叩く
      # (env の DATABASE_URL をそのまま使う)。
      - run: npx vitest run integration

      # build は DB に接続しないが、Prisma Client の初期化に URL の形式だけ要る。
      # npm run build は prisma db push --accept-data-loss を含むので使わない。
      - run: npx next build

  # 6サービス(web/worker1-3/event-worker/worker-guardian)が同じ Dockerfile を
  # 個別ビルドしている無駄をなくすため、ここで1回だけビルドして GHCR へ push する。
  # Railway 側への配布(段階的ロールアウト中)は deploy-railway ジョブが担う。
  build-and-push:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: live-sidestage-analytics
          file: live-sidestage-analytics/Dockerfile
          push: true
          tags: |
            ghcr.io/graphica-live/live-sidestage-analytics:${{ steps.meta.outputs.tag }}
            ghcr.io/graphica-live/live-sidestage-analytics:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Railway 側の source を GitHub repo から Docker Image へ切り替えたサービスだけを
  # 対象に、新しいイメージへ更新する。まだ切り替えていないサービスの ID を
  # RAILWAY_ANALYTICS_MANAGED_SERVICE_IDS に含めてはいけない(誤って更新される)。
  # 段階的ロールアウトの間はこの変数を手で1件ずつ増やす運用。
  deploy-railway:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: analytics-railway-deploy
      cancel-in-progress: false
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      IMAGE_REF: ghcr.io/graphica-live/live-sidestage-analytics:${{ needs.build-and-push.outputs.image_tag }}
      MANAGED_SERVICE_IDS: ${{ vars.RAILWAY_ANALYTICS_MANAGED_SERVICE_IDS }}
    steps:
      - name: Update image on migrated Railway services
        run: |
          set -euo pipefail
          if [ -z "${MANAGED_SERVICE_IDS:-}" ] || [ "$MANAGED_SERVICE_IDS" = "[]" ]; then
            echo "no managed services yet, skipping"
            exit 0
          fi
          echo "$MANAGED_SERVICE_IDS" | jq -r '.[]' | while read -r sid; do
            resp=$(curl -sS --fail-with-body -X POST https://backboard.railway.com/graphql/v2 \
              -H "Authorization: Bearer $RAILWAY_TOKEN" -H "Content-Type: application/json" \
              -d "$(jq -nc --arg sid "$sid" --arg img "$IMAGE_REF" \
                '{query:"mutation($sid:String!,$img:String!){ serviceConnect(id:$sid, input:{image:$img}) { id } }", variables:{sid:$sid,img:$img}}')")
            echo "$resp"
            echo "$resp" | jq -e '.data.serviceConnect.id' >/dev/null || { echo "::error::failed for $sid"; exit 1; }
          done
