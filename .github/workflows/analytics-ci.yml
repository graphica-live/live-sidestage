name: analytics CI

# モノレポなので paths で対象プロジェクトを必ず絞る。
# 絞らないと他4プロジェクトの push でも発火する。
#
# イベント機能(旧 live-sidestage-event)は live-sidestage-analytics へ統合したので、
# このワークフローが両方を検証する。
on:
  push:
    paths:
      - "live-sidestage-analytics/**"
      - ".github/workflows/analytics-ci.yml"
  pull_request:
    paths:
      - "live-sidestage-analytics/**"
      - ".github/workflows/analytics-ci.yml"

defaults:
  run:
    working-directory: live-sidestage-analytics

jobs:
  verify:
    runs-on: ubuntu-latest

    # integration テストは実DBを使う(スナップショット集計・advisory lock・
    # public と event をまたぐ結合は、モックでは意味のある検証にならない)。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: liveanalytics
          POSTGRES_PASSWORD: liveanalytics
          POSTGRES_DB: liveanalytics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U liveanalytics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://liveanalytics:liveanalytics@localhost:5432/liveanalytics_test"
      NEXTAUTH_SECRET: "ci-only"
      MOBILE_JWT_SECRET: "k9SrzS5iMHPkKt2I4VffPG5qP3cDESRY17MX27+q6p4="
      REFRESH_TOKEN_REPLAY_ENC_KEY: "HbDF6s5VJHPOOUwzTheIZhrTUmJUxETmbyT7n8F2wbw="
      WORKER_COUNT: "1"
      WORKER_INDEX: "0"

    steps:
      # fetch-depth: 0 は scripts/check-migration-safety.ts の
      # `git diff origin/main...HEAD` が origin/main を解決できるようにするため必須
      # (既定の shallow clone だと参照が無く、静かに「新規migrationなし」扱いになる)。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: live-sidestage-analytics/package-lock.json

      - run: npm ci

      - run: npx prisma generate

      - run: npm run typecheck

      - run: npm run test:unit

      # Detect and warn about destructive DDL (DROP TABLE, DROP COLUMN, etc) in migration files.
      # Does not fail CI, only alerts reviewers.
      - run: npx tsx scripts/check-migration-safety.ts

      # Apply baseline migration to test DB.
      # prisma/migrations/ contains 0_init and Wave1-B CHECK migration, so migrate deploy applies both.
      - run: npx prisma migrate deploy

      # Verify no schema drift between applied DB and schema.prisma.
      # Fails if differences found (exit code 2).
      - run: npx prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --exit-code

      # test:integration は .env.local.test を読む script なので、CI では直接叩く
      # (env の DATABASE_URL をそのまま使う)。
      - run: npx vitest run integration

      # build は DB に接続しないが、Prisma Client の初期化に URL の形式だけ要る。
      # 2026-09-11: npm run build の破壊的な db push(--accept-data-loss)ステップは
      # 除去済み(prisma migrate deploy 移行、docs/deploy/prisma-migration-runbook.md 参照)。
      # ここでは next build の型・ルーティング検証のみを目的に npx next build を直接使う。
      - run: npx next build

  # 6サービス(web/worker1-3/event-worker/worker-guardian)が同じ Dockerfile を
  # 個別ビルドしている無駄をなくすため、ここで1回だけビルドして GHCR へ push する。
  # Railway 側への配布(段階的ロールアウト中)は deploy-railway ジョブが担う。
  build-and-push:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: live-sidestage-analytics
          file: live-sidestage-analytics/Dockerfile
          push: true
          tags: |
            ghcr.io/graphica-live/live-sidestage-analytics:${{ steps.meta.outputs.tag }}
            ghcr.io/graphica-live/live-sidestage-analytics:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # RAILWAY_ANALYTICS_MANAGED_SERVICE_IDS:
  # GitHub native deploy ではなく、analytics-ci が build した GHCR image を
  # serviceConnect(image) で管理する Service ID 一覧(JSON配列)。
  # 「既に Dashboard で Docker Image へ手動移行済みの ID」ではない。
  # 次回このジョブが走ると serviceConnect(image) が実行され、
  # GitHub Source のサービスはそこで Docker Image Source へ切り替わる
  # (初回=切替+image設定、2回目以降=image tag 更新。mutation は同じ)。
  # Dashboard での事前 Source 切替は不要。serviceDisconnect も挟まない。
  # 一度に複数追加せず1件ずつ増やすのは安全なロールアウト策(必須ではない)。
  # 空 / [] ならこのジョブは skip。DeploymentTrigger は操作しない。
  deploy-railway:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # このジョブは checkout しないので、ワークフロー冒頭の
    # defaults.run.working-directory: live-sidestage-analytics を打ち消す必要がある
    # (打ち消さないと存在しないディレクトリでシェルを起動しようとして落ちる)。
    defaults:
      run:
        working-directory: .
    concurrency:
      group: analytics-railway-deploy
      cancel-in-progress: false
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      IMAGE_REF: ghcr.io/graphica-live/live-sidestage-analytics:${{ needs.build-and-push.outputs.image_tag }}
      MANAGED_SERVICE_IDS: ${{ vars.RAILWAY_ANALYTICS_MANAGED_SERVICE_IDS }}
    steps:
      - name: Deploy managed Railway services from GHCR
        run: |
          set -euo pipefail
          if [ -z "${MANAGED_SERVICE_IDS:-}" ] || [ "$MANAGED_SERVICE_IDS" = "[]" ]; then
            echo "no managed services yet, skipping"
            exit 0
          fi
          railway_gql() {
            curl -sS --fail-with-body -X POST https://backboard.railway.com/graphql/v2 \
              -H "Authorization: Bearer $RAILWAY_TOKEN" -H "Content-Type: application/json" \
              -d "$1"
          }
          while IFS= read -r sid; do
            [ -z "$sid" ] && continue
            connect_body=$(jq -nc --arg sid "$sid" --arg img "$IMAGE_REF" \
              '{query:"mutation($sid:String!,$img:String!){ serviceConnect(id:$sid, input:{image:$img}) { id } }", variables:{sid:$sid,img:$img}}')
            resp=$(railway_gql "$connect_body")
            echo "$resp"
            echo "$resp" | jq -e '.data.serviceConnect.id' >/dev/null || { echo "::error::serviceConnect failed for $sid"; exit 1; }

            source_body=$(jq -nc --arg sid "$sid" \
              '{query:"query($sid:String!){ service(id:$sid){ id name serviceInstances { edges { node { environmentId source { image repo } } } } } }", variables:{sid:$sid}}')
            source_resp=$(railway_gql "$source_body")
            echo "$source_resp"
            echo "$source_resp" | jq -e '.data.service' >/dev/null || { echo "::error::source query failed for $sid"; exit 1; }

            echo "$source_resp" | jq -r --arg img "$IMAGE_REF" --arg sid "$sid" '
              .data.service.serviceInstances.edges[]? as $e
              | "source check service=\($sid) env=\($e.node.environmentId // "null") image=\($e.node.source.image // "null") repo=\($e.node.source.repo // "null") expected=\($img)"
            '

            unmatched=$(echo "$source_resp" | jq -r --arg img "$IMAGE_REF" '
              [
                .data.service.serviceInstances.edges[]?
                | select((.node.source.image // "") != $img)
                | .node.environmentId
              ] | length
            ')
            instance_count=$(echo "$source_resp" | jq -r '.data.service.serviceInstances.edges | length')
            if [ "$instance_count" = "0" ]; then
              echo "::error::no serviceInstances returned for $sid"
              exit 1
            fi
            if [ "$unmatched" != "0" ]; then
              echo "::error::source.image mismatch for $sid ($unmatched instance(s) != $IMAGE_REF)"
              exit 1
            fi
          done < <(echo "$MANAGED_SERVICE_IDS" | jq -r '.[]')
