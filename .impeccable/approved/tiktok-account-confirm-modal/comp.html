<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #111111;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    color: #f0f0f0;
    width: 900px;
    height: 640px;
  }
  .backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    width: 360px;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5), 0 8px 10px -6px rgba(0,0,0,0.5);
    padding: 16px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .avatar {
    width: 64px;
    height: 64px;
    border-radius: 9999px;
    background: linear-gradient(135deg, #fe2c55, #7a1530);
    flex-shrink: 0;
  }
  .nickname {
    color: #ffffff;
    font-weight: 600;
    font-size: 0.875rem;
    line-height: 1.4;
  }
  .handle {
    color: #8b90a0;
    font-size: 0.75rem;
    margin-top: 2px;
  }
  .bio {
    margin-top: 12px;
    color: #6b7280;
    font-size: 0.75rem;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .stats {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }
  .stat {
    flex: 1;
    background: #111111;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    padding: 8px 12px;
    text-align: center;
  }
  .stat-label {
    color: #6b7280;
    font-size: 0.75rem;
    font-weight: 500;
  }
  .stat-value {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.875rem;
    font-weight: 500;
    color: #f0f0f0;
    margin-top: 2px;
  }
  .confirm-text {
    margin-top: 16px;
    font-size: 0.875rem;
    color: #f0f0f0;
    line-height: 1.5;
  }
  .actions {
    margin-top: 16px;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  .btn {
    border-radius: 8px;
    font-size: 0.875rem;
    padding: 8px 16px;
    border: none;
    cursor: pointer;
  }
  .btn-ghost {
    background: transparent;
    color: #9ca3af;
  }
  .btn-primary {
    background: #fe2c55;
    color: #ffffff;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="backdrop">
    <div class="card">
      <div class="row">
        <div class="avatar"></div>
        <div>
          <div class="nickname">AYANE🧸🥞🎶</div>
          <div class="handle">@ayane_0327</div>
        </div>
      </div>
      <div class="stats">
        <div class="stat">
          <div class="stat-label">フォロー</div>
          <div class="stat-value">1,075</div>
        </div>
        <div class="stat">
          <div class="stat-label">フォロワー</div>
          <div class="stat-value">26,477</div>
        </div>
      </div>
      <div class="bio">TikTokで踊ったり歌ったりしてます🌟 毎日20時から配信中！応援よろしくお願いします✨ グッズ販売中→プロフのリンクから</div>
      <div class="confirm-text">このユーザーでよろしいですか？</div>
      <div class="actions">
        <button class="btn btn-ghost">キャンセル</button>
        <button class="btn btn-primary">登録する</button>
      </div>
    </div>
  </div>
</body>
</html>
