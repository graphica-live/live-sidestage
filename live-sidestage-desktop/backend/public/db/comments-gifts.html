<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comment & Gift</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #e6edf4;
        }

        .split {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .split-pane {
            flex: 1 1 50%;
            width: 50%;
            height: 100%;
            border: none;
            display: block;
        }

        .split-pane + .split-pane {
            border-left: 1px solid rgba(24, 37, 58, 0.18);
        }
    </style>
</head>
<body>
    <div class="split">
        <iframe class="split-pane" id="comments-pane" src="/comments?popout=1" title="コメント欄"></iframe>
        <iframe class="split-pane" id="gifts-pane" src="/gifts?popout=1" title="ギフト履歴"></iframe>
    </div>
</body>
</html>
