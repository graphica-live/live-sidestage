<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ギフト日本語名 手動編集</title>
    <link rel="stylesheet" href="/db/admin-buttons.css">
    <style>
        :root {
            --bg: #e6edf4;
            --panel: #f6f9fc;
            --line: rgba(24, 37, 58, 0.18);
            --text: #18253a;
            --muted: #596b80;
            --accent: #c2410c;
            --accent-strong: #9a3412;
            --ok: #1a7f4b;
            --ok-bg: rgba(26, 127, 75, 0.1);
            --shadow: 0 10px 24px rgba(24, 37, 58, 0.12);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px 16px 64px;
            color: var(--text);
            font-family: "Bahnschrift", "Yu Gothic UI", sans-serif;
            background: linear-gradient(180deg, #eef4fa 0%, #e3ebf3 100%);
        }

        .layout {
            width: min(920px, 100%);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 22px 24px;
        }

        h1 { margin: 0 0 6px; font-size: 24px; line-height: 1.2; }
        .subtext { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.7; }
        .subtext code { background: rgba(24,37,58,0.06); padding: 1px 5px; border-radius: 4px; }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-top: 16px;
        }

        input[type="text"], input[type="search"] {
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 9px 12px;
            font: inherit;
            background: rgba(255, 255, 255, 0.85);
            color: var(--text);
        }

        #searchInput { flex: 1 1 260px; }

        label.toggle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--muted);
            white-space: nowrap;
        }

        .status-line {
            margin: 10px 2px 0;
            font-size: 12.5px;
            color: var(--muted);
        }

        .list-panel { padding: 10px 10px 16px; }

        .row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 14px;
            align-items: center;
            padding: 10px 14px;
            border-bottom: 1px solid var(--line);
        }
        .row:last-child { border-bottom: none; }

        .gift-cell {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .gift-image {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.6);
            object-fit: cover;
            flex: 0 0 auto;
        }

        .gift-meta { min-width: 0; display: grid; gap: 2px; }
        .gift-meta strong {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 14px;
        }
        .gift-meta span {
            color: var(--muted);
            font-size: 12px;
        }

        .input-cell {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ja-input {
            flex: 1 1 auto;
            min-width: 0;
        }

        .save-indicator {
            flex: 0 0 auto;
            width: 18px;
            height: 18px;
            display: grid;
            place-items: center;
            font-size: 13px;
            color: var(--ok);
            opacity: 0;
            transition: opacity 160ms ease;
        }
        .save-indicator.visible { opacity: 1; }
        .save-indicator.saving { color: var(--muted); }
        .save-indicator.error { color: var(--accent-strong); }

        .row.is-translated .ja-input { border-color: var(--ok); background: var(--ok-bg); }

        .ja-autocomplete {
            position: fixed;
            display: none;
            z-index: 50;
            max-height: 260px;
            overflow-y: auto;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 10px;
            box-shadow: var(--shadow);
            min-width: 200px;
        }
        .ac-item {
            padding: 7px 12px;
            font-size: 13px;
            cursor: pointer;
            border-bottom: 1px solid rgba(24,37,58,0.06);
        }
        .ac-item:last-child { border-bottom: none; }
        .ac-item:hover, .ac-item.is-active { background: rgba(194, 65, 12, 0.08); }
        .ac-empty {
            padding: 10px 12px;
            font-size: 12.5px;
            color: var(--muted);
        }

        .empty-state {
            padding: 40px;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="layout">
        <header class="panel">
            <h1>ギフト日本語名 手動編集</h1>
            <p class="subtext">
                左に実際のカタログ画像・英語名・コイン数、右に日本語名の入力欄です。入力すると自動保存され、
                <code>backend/lib/gift-name-ja.js</code> に即座に反映されます（サーバー再起動不要）。
                入力欄をクリックすると、コイン価格の近さから推定した候補が下に出ます。文字を打つと
                参照リスト全体から絞り込みます。候補は目安なので、実際のTikTokクライアントと見比べて選んでください。
                一度使った日本語名は他の行の候補から自動的に消えます。
                このページはナビゲーションから開けない直接URLです。
            </p>
            <div class="toolbar">
                <input id="searchInput" type="search" placeholder="英語名・日本語名・コイン数で検索…" />
                <label class="toggle">
                    <input id="untranslatedOnly" type="checkbox" />
                    未翻訳のみ表示
                </label>
                <button id="reloadBtn" type="button">再読み込み</button>
            </div>
            <p class="status-line" id="statusLine">読み込み中…</p>
        </header>

        <main class="panel list-panel">
            <div id="listBody"></div>
            <div class="empty-state" id="emptyState" style="display:none;">該当するギフトがありません。</div>
        </main>
        <div id="jaAutocomplete" class="ja-autocomplete"></div>
    </div>

    <script>
        let gifts = [];
        let giftRankMap = new WeakMap();
        let referenceList = [];
        let query = '';
        let untranslatedOnly = false;
        const saveTimers = new Map();
        const SUGGESTION_WINDOW = 25;
        const AUTOCOMPLETE_LIMIT = 40;

        const autocompleteEl = document.getElementById('jaAutocomplete');
        let autocompleteState = null; // { input, name, rowEl, indicator }

        async function loadReferenceList() {
            try {
                const res = await fetch('/api/gift-name-ja/reference-list');
                const data = await res.json();
                referenceList = Array.isArray(data.list) ? data.list : [];
            } catch (err) {
                console.error('reference list load failed', err);
                referenceList = [];
            }
        }

        // GIFT_NAME_JA_MAP で既に確定している翻訳を「アンカー」として使い、
        // カタログのコイン価格ランクと参照リスト内インデックスの対応関係を
        // 区間ごとに線形補間する。価格帯によって密度が大きく異なる
        // (安いギフトが密集し、高額ギフトは疎)ため、単純な全体比率だと
        // 高額帯で候補が大きくズレる。確定訳が増えるほどこの推定も
        // 自動的に精度が上がる。
        function buildAnchors() {
            const anchors = [];
            gifts.forEach((g, rank) => {
                if (!isTranslated(g)) return;
                const jaIndex = referenceList.indexOf(g.nameJa);
                if (jaIndex === -1) return;
                anchors.push({ rank, jaIndex });
            });
            anchors.sort((a, b) => a.rank - b.rank);
            return anchors;
        }

        function estimateJaIndex(rank, anchors) {
            if (!referenceList.length) return 0;
            if (!anchors.length) {
                return Math.round((rank / gifts.length) * referenceList.length);
            }
            if (anchors.length === 1) {
                return anchors[0].jaIndex + (rank - anchors[0].rank);
            }
            if (rank <= anchors[0].rank) {
                const a = anchors[0], b = anchors[1];
                const slope = (b.jaIndex - a.jaIndex) / ((b.rank - a.rank) || 1);
                return Math.round(a.jaIndex + slope * (rank - a.rank));
            }
            const last = anchors[anchors.length - 1];
            if (rank >= last.rank) {
                const a = anchors[anchors.length - 2], b = last;
                const slope = (b.jaIndex - a.jaIndex) / ((b.rank - a.rank) || 1);
                return Math.round(b.jaIndex + slope * (rank - b.rank));
            }
            for (let i = 0; i < anchors.length - 1; i++) {
                const a = anchors[i], b = anchors[i + 1];
                if (rank >= a.rank && rank <= b.rank) {
                    if (a.rank === b.rank) return a.jaIndex;
                    const frac = (rank - a.rank) / (b.rank - a.rank);
                    return Math.round(a.jaIndex + frac * (b.jaIndex - a.jaIndex));
                }
            }
            return Math.round((rank / gifts.length) * referenceList.length);
        }

        function usedJaNames() {
            return new Set(gifts.filter(isTranslated).map(g => g.nameJa));
        }

        function suggestionsFor(rankIndex, anchors, usedSet, ownValue) {
            if (!referenceList.length || !gifts.length) return [];
            const estimated = estimateJaIndex(rankIndex, anchors);
            const start = Math.max(0, estimated - SUGGESTION_WINDOW);
            const end = Math.min(referenceList.length, estimated + SUGGESTION_WINDOW + 1);
            return referenceList.slice(start, end).filter(s => s === ownValue || !usedSet.has(s));
        }

        function autocompleteCandidates(rankIndex, anchors, usedSet, ownValue, queryText) {
            const q = queryText.trim();
            let pool;
            if (!q) {
                pool = suggestionsFor(rankIndex, anchors, usedSet, ownValue);
            } else {
                pool = referenceList.filter(s => (s === ownValue || !usedSet.has(s)) && s.includes(q));
            }
            return pool.slice(0, AUTOCOMPLETE_LIMIT);
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function isTranslated(gift) {
            return gift.nameJa && gift.nameJa !== gift.name;
        }

        async function loadGifts(forceRefresh) {
            document.getElementById('statusLine').textContent = '読み込み中…';
            const url = '/api/tiktok/gifts' + (forceRefresh ? '?force=1' : '');
            const res = await fetch(url);
            if (!res.ok) {
                document.getElementById('statusLine').textContent = 'ギフト一覧の取得に失敗しました。';
                return;
            }
            const data = await res.json();
            gifts = (data.gifts || []).slice().sort((a, b) => a.diamondCount - b.diamondCount || a.name.localeCompare(b.name));
            giftRankMap = new WeakMap();
            gifts.forEach((g, idx) => giftRankMap.set(g, idx));
            render();
        }

        function updateStatusLine() {
            const total = gifts.length;
            const translated = gifts.filter(isTranslated).length;
            document.getElementById('statusLine').textContent =
                `全 ${total} 件中 ${translated} 件に日本語名あり（${total - translated} 件が英語フォールバック中）`;
        }

        function filteredGifts() {
            const q = query.trim().toLowerCase();
            return gifts.filter(g => {
                if (untranslatedOnly && isTranslated(g)) return false;
                if (!q) return true;
                if (g.name.toLowerCase().includes(q) || (g.nameJa || '').toLowerCase().includes(q)) return true;
                return String(g.diamondCount).includes(q);
            });
        }

        function hideAutocomplete() {
            autocompleteEl.style.display = 'none';
            autocompleteEl.innerHTML = '';
            autocompleteState = null;
        }

        function positionAutocomplete(input) {
            const rect = input.getBoundingClientRect();
            autocompleteEl.style.left = Math.round(rect.left) + 'px';
            autocompleteEl.style.top = Math.round(rect.bottom + 4) + 'px';
            autocompleteEl.style.width = Math.round(rect.width) + 'px';
        }

        function renderAutocomplete() {
            if (!autocompleteState) return;
            const { input, rankIndex, anchors } = autocompleteState;
            const usedSet = usedJaNames();
            const candidates = autocompleteCandidates(rankIndex, anchors, usedSet, input.value, input.value);

            autocompleteEl.innerHTML = candidates.length
                ? candidates.map(c => `<div class="ac-item" data-value="${escapeHtml(c)}">${escapeHtml(c)}</div>`).join('')
                : '<div class="ac-empty">候補なし</div>';
            positionAutocomplete(input);
            autocompleteEl.style.display = 'block';
        }

        function showAutocomplete(input, name, rowEl, indicator, rankIndex, anchors) {
            autocompleteState = { input, name, rowEl, indicator, rankIndex, anchors };
            renderAutocomplete();
        }

        autocompleteEl.addEventListener('mousedown', (e) => {
            e.preventDefault();
        });
        autocompleteEl.addEventListener('click', (e) => {
            const item = e.target.closest('.ac-item');
            if (!item || !autocompleteState) return;
            const { input, name, rowEl, indicator } = autocompleteState;
            input.value = item.dataset.value;
            saveValue(name, input.value, rowEl, indicator);
            hideAutocomplete();
        });
        document.addEventListener('click', (e) => {
            if (autocompleteState && !autocompleteEl.contains(e.target) && e.target !== autocompleteState.input) {
                hideAutocomplete();
            }
        });
        window.addEventListener('resize', () => {
            if (autocompleteState) positionAutocomplete(autocompleteState.input);
        });
        window.addEventListener('scroll', () => {
            if (autocompleteState) positionAutocomplete(autocompleteState.input);
        }, true);

        function render() {
            updateStatusLine();
            const list = filteredGifts();
            const listBody = document.getElementById('listBody');
            const empty = document.getElementById('emptyState');
            const anchors = buildAnchors();

            if (!list.length) {
                listBody.innerHTML = '';
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';

            listBody.innerHTML = list.map(g => {
                const translated = isTranslated(g);
                const inputValue = translated ? g.nameJa : '';
                const imgHtml = g.imageUrl
                    ? `<img class="gift-image" src="${escapeHtml(g.imageUrl)}" alt="" loading="lazy" />`
                    : `<div class="gift-image is-empty"></div>`;
                return `<div class="row${translated ? ' is-translated' : ''}" data-name="${escapeHtml(g.name)}">
                    <div class="gift-cell">
                        ${imgHtml}
                        <div class="gift-meta">
                            <strong>${escapeHtml(g.name)}</strong>
                            <span>${g.diamondCount.toLocaleString('ja-JP')} コイン</span>
                        </div>
                    </div>
                    <div class="input-cell">
                        <input type="text" class="ja-input" value="${escapeHtml(inputValue)}" placeholder="未翻訳（英語表示中）" />
                        <span class="save-indicator">✓</span>
                    </div>
                </div>`;
            }).join('');

            listBody.querySelectorAll('.row').forEach((rowEl, idx) => {
                const g = list[idx];
                const name = rowEl.dataset.name;
                const input = rowEl.querySelector('.ja-input');
                const indicator = rowEl.querySelector('.save-indicator');
                const rankIndex = giftRankMap.has(g) ? giftRankMap.get(g) : idx;

                const scheduleSave = () => {
                    const timerId = saveTimers.get(name);
                    if (timerId) clearTimeout(timerId);
                    saveTimers.set(name, setTimeout(() => saveValue(name, input.value, rowEl, indicator), 500));
                };

                input.addEventListener('focus', () => showAutocomplete(input, name, rowEl, indicator, rankIndex, anchors));
                input.addEventListener('input', () => {
                    scheduleSave();
                    if (autocompleteState && autocompleteState.input === input) renderAutocomplete();
                });
                input.addEventListener('blur', () => {
                    const timerId = saveTimers.get(name);
                    if (timerId) clearTimeout(timerId);
                    saveValue(name, input.value, rowEl, indicator);
                    setTimeout(() => {
                        if (autocompleteState && autocompleteState.input === input) hideAutocomplete();
                    }, 150);
                });
            });
        }

        async function saveValue(name, value, rowEl, indicator) {
            indicator.textContent = '…';
            indicator.className = 'save-indicator visible saving';
            try {
                const res = await fetch('/api/gift-name-ja', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, value })
                });
                const data = await res.json();
                if (!res.ok || !data.ok) {
                    throw new Error(data.error || '保存に失敗しました。');
                }

                const gift = gifts.find(g => g.name === name);
                if (gift) gift.nameJa = data.nameJa;

                rowEl.classList.toggle('is-translated', data.nameJa !== name);
                indicator.textContent = '✓';
                indicator.className = 'save-indicator visible';
                updateStatusLine();
                setTimeout(() => indicator.classList.remove('visible'), 1400);
                // 他の行で開いている候補ドロップダウンからも今使った名前を除外するため、
                // 全体再描画はせず開いているドロップダウンだけ再計算する(フォーカス維持のため)。
                if (autocompleteState) renderAutocomplete();
            } catch (err) {
                indicator.textContent = '!';
                indicator.className = 'save-indicator visible error';
                console.error('gift-name-ja save failed', err);
            }
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            query = e.target.value;
            render();
        });
        document.getElementById('untranslatedOnly').addEventListener('change', (e) => {
            untranslatedOnly = e.target.checked;
            render();
        });
        document.getElementById('reloadBtn').addEventListener('click', () => loadGifts(true));

        (async () => {
            await loadReferenceList();
            await loadGifts(false);
        })();
    </script>
</body>
</html>
