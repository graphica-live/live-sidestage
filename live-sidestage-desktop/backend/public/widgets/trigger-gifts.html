<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>トリガーギフト一覧</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&family=Noto+Sans+JP:wght@400;700;900&display=swap');

        :root {
            --widget-font-family: "M PLUS Rounded 1c", "Noto Sans JP", sans-serif;
            --name-color: #f8fafc;
            --stroke: rgba(15, 23, 42, 0.96);
            --shadow: rgba(15, 23, 42, 0.40);
            --card-min-width: 200px;
            --gift-image-height: 132px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            min-height: 100%;
            background: transparent;
            font-family: var(--widget-font-family);
        }

        body {
            padding: 24px;
        }

        body.preview-card {
            min-height: 100vh;
            background: radial-gradient(circle at top, rgba(30, 41, 59, 0.88) 0%, rgba(15, 23, 42, 0.94) 100%);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(var(--card-min-width), 1fr));
            gap: 18px;
        }

        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 16px 12px;
            border-radius: 20px;
            background: linear-gradient(180deg, rgba(36, 40, 48, 0.46) 0%, rgba(20, 22, 28, 0.52) 100%);
            border: 1px solid rgba(255, 255, 255, 0.09);
            backdrop-filter: blur(14px) saturate(140%);
            -webkit-backdrop-filter: blur(14px) saturate(140%);
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.30);
            animation: cardIn 320ms cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .gift-image-wrap {
            width: 100%;
            height: var(--gift-image-height);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gift-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .gift-image-placeholder {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.10);
        }

        .trigger-name {
            width: 100%;
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            line-height: 1.3;
            color: var(--name-color);
            -webkit-text-stroke: 3px var(--stroke);
            paint-order: stroke fill;
            text-shadow: 0 4px 14px var(--shadow);
            overflow-wrap: break-word;
        }

        .empty {
            font-size: 16px;
            color: rgba(241, 245, 249, 0.55);
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(10px) scale(0.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body>
    <div class="grid" id="grid"></div>

    <script>
        const socket = io();
        const searchParams = new URLSearchParams(window.location.search);
        const categoryId = searchParams.get('category') || '';
        const previewMode = searchParams.get('preview') === '1' || searchParams.get('sample') === '1';
        const gridEl = document.getElementById('grid');

        if (previewMode) {
            document.body.classList.add('preview-card');
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function escapeAttr(s) {
            return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function buildCardHtml(item) {
            const imageHtml = item.giftImageUrl
                ? `<img class="gift-image" src="${escapeAttr(item.giftImageUrl)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'gift-image-placeholder'}))">`
                : `<div class="gift-image-placeholder"></div>`;

            return `<div class="card">` +
                `<div class="gift-image-wrap">${imageHtml}</div>` +
                `<div class="trigger-name">${escapeHtml(item.triggerName)}</div>` +
                `</div>`;
        }

        function render(items) {
            if (!Array.isArray(items) || items.length === 0) {
                gridEl.innerHTML = previewMode ? '<div class="empty">有効なトリガーがありません</div>' : '';
                return;
            }

            gridEl.innerHTML = items.map(buildCardHtml).join('');
        }

        function loadSnapshot() {
            if (!categoryId) {
                render([]);
                return;
            }

            fetch(`/api/effects/trigger-gifts?category=${encodeURIComponent(categoryId)}`)
                .then((r) => r.json())
                .then((payload) => render(payload.items))
                .catch(() => {});
        }

        socket.on('connect', loadSnapshot);
        socket.on('effects:trigger-gifts:updated', loadSnapshot);

        loadSnapshot();
    </script>
</body>
</html>
