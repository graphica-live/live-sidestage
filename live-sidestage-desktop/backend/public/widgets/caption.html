<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字幕</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&family=Noto+Sans+JP:wght@400;700;900&family=Noto+Serif+JP:wght@400;700;900&family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Kosugi&family=Zen+Old+Mincho:wght@400;700;900&family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@400;700;900&family=Yuji+Syuku&family=Dela+Gothic+One&family=DotGothic16&family=Hachi+Maru+Pop&family=RocknRoll+One&family=Yusei+Magic&family=Kaisei+Decol:wght@400;500;700&family=Mochiy+Pop+One&family=Rampart+One&family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Antique&family=Yuji+Mai&family=Sawarabi+Mincho&family=Potta+One&family=Murecho:wght@100;300;400;700&family=Stick&display=swap');

        :root {
            --widget-font-family: "M PLUS Rounded 1c", sans-serif;
            --caption-fill: #ffffff;
            --caption-note: #fde68a;
            --caption-stroke: rgba(10, 10, 20, 0.95);
            --caption-shadow: rgba(0, 0, 0, 0.7);
            --caption-stroke-width: 6px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            min-height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: var(--widget-font-family, "M PLUS Rounded 1c", sans-serif);
        }

        #caption-wrap {
            position: fixed;
            bottom: var(--caption-bottom, 120px);
            left: 0;
            right: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 40px;
            pointer-events: none;
        }

        .caption-line {
            max-width: 1600px;
            width: 100%;
            text-align: center;
            line-height: 1.3;
            word-break: break-all;
            transition: opacity 0.25s ease;
        }

        .caption-line.hidden {
            opacity: 0;
        }

        #original-text {
            font-size: var(--font-size, 52px);
            font-weight: 900;
            color: var(--caption-fill, #ffffff);
            -webkit-text-stroke: var(--caption-stroke-width, 6px) var(--caption-stroke, rgba(10, 10, 20, 0.95));
            paint-order: stroke fill;
            text-shadow:
                0 0 20px var(--caption-shadow, rgba(0, 0, 0, 0.7)),
                0 3px 12px rgba(0, 0, 0, 0.5);
        }

        #original-text.interim {
            color: rgba(255, 255, 255, 0.72);
        }

        #translated-text {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            margin: 6px auto 0;
            font-size: calc(var(--font-size, 52px) * 0.72);
            font-weight: 800;
            color: var(--caption-note, #fde68a);
            -webkit-text-stroke: calc(var(--caption-stroke-width, 6px) - 1px) var(--caption-stroke, rgba(10, 10, 20, 0.95));
            paint-order: stroke fill;
            text-shadow:
                0 0 16px var(--caption-shadow, rgba(0, 0, 0, 0.7)),
                0 3px 10px rgba(0, 0, 0, 0.5);
        }

        body.bg-semi .caption-line:not(.hidden) {
            background: rgba(0, 0, 0, 0.54);
            border-radius: 12px;
            padding: 8px 24px;
            backdrop-filter: blur(4px);
        }

        @keyframes slideIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .caption-line.slide-in {
            animation: slideIn 0.2s ease-out forwards;
        }
    </style>
</head>
<body>
    <div id="caption-wrap">
        <div class="caption-line hidden" id="original-text"></div>
        <div class="caption-line hidden" id="translated-text"></div>
    </div>

    <script>
        const socket = io();
        const params = new URLSearchParams(window.location.search);
        const originalEl = document.getElementById('original-text');
        const translatedEl = document.getElementById('translated-text');

        let hideTimer = null;
        // Separate timers per element — shared timer caused one to cancel the other
        const twTimer = { original: null, translated: null };
        let currentSettings = {};

        const CAPTION_FONT_FAMILIES = {
            default:          '"M PLUS Rounded 1c", sans-serif',
            gothic:           '"Noto Sans JP", sans-serif',
            'ui-gothic':      '"Zen Kaku Gothic New", sans-serif',
            mincho:           '"Noto Serif JP", serif',
            'ud-gothic':      '"Kosugi", sans-serif',
            'ud-mincho':      '"Zen Old Mincho", serif',
            meiryo:           '"Klee One", cursive',
            rounded:          '"Zen Maru Gothic", sans-serif',
            kyokasho:         '"Klee One", cursive',
            gyosho:           '"Yuji Syuku", cursive',
            togarie:          '"Dela Gothic One", sans-serif',
            'ln-pop':         '"Mochiy Pop One", sans-serif',
            'comic-impact':   '"Rampart One", sans-serif',
            'pop-idol':       '"Hachi Maru Pop", cursive',
            entame:           '"RocknRoll One", sans-serif',
            marker:           '"Yusei Magic", cursive',
            'retro-bold':     '"Kaisei Decol", serif',
            'luxury-mincho':  '"Shippori Mincho B1", serif',
            'antique-modern': '"Zen Antique", serif',
            'atelier-brush':  '"Yuji Mai", cursive',
            'pixel-code':     '"DotGothic16", "Noto Sans JP", sans-serif',
            'sawarabi-mincho':'"Sawarabi Mincho", serif',
            'potta-one':      '"Potta One", sans-serif',
            'murecho-thin':   '"Murecho", sans-serif',
            stick:            '"Stick", sans-serif'
        };
        const CAPTION_TEXT_STYLES = {
            'gold-night':       { fillColor: '#ffffff',  noteColor: '#fde68a',  strokeColor: 'rgba(10,10,20,0.95)',   textShadow: 'rgba(0,0,0,0.7)' },
            'ice-night':        { fillColor: '#dbeafe',  noteColor: '#bfdbfe',  strokeColor: 'rgba(23,37,84,0.95)',   textShadow: 'rgba(23,37,84,0.6)' },
            'candy-pop':        { fillColor: '#ffe4f1',  noteColor: '#fbcfe8',  strokeColor: 'rgba(131,24,67,0.95)',  textShadow: 'rgba(131,24,67,0.6)' },
            'mint-lime':        { fillColor: '#d1fae5',  noteColor: '#6ee7b7',  strokeColor: 'rgba(6,78,59,0.96)',    textShadow: 'rgba(6,78,59,0.6)' },
            'sunset-party':     { fillColor: '#fed7aa',  noteColor: '#fb923c',  strokeColor: 'rgba(120,53,15,0.96)',  textShadow: 'rgba(120,53,15,0.6)' },
            'violet-flash':     { fillColor: '#e9d5ff',  noteColor: '#c084fc',  strokeColor: 'rgba(59,7,100,0.96)',   textShadow: 'rgba(59,7,100,0.6)' },
            'mono-impact':      { fillColor: '#f8fafc',  noteColor: '#e2e8f0',  strokeColor: 'rgba(2,6,23,0.97)',     textShadow: 'rgba(0,0,0,0.75)' },
            'sakura-bloom':     { fillColor: '#ffe4e6',  noteColor: '#fda4af',  strokeColor: 'rgba(136,19,55,0.95)',  textShadow: 'rgba(136,19,55,0.6)' },
            'ocean-glow':       { fillColor: '#bae6fd',  noteColor: '#38bdf8',  strokeColor: 'rgba(12,74,110,0.96)',  textShadow: 'rgba(12,74,110,0.6)' },
            'emerald-city':     { fillColor: '#bbf7d0',  noteColor: '#86efac',  strokeColor: 'rgba(20,83,45,0.96)',   textShadow: 'rgba(20,83,45,0.6)' },
            'ruby-flare':       { fillColor: '#ffe4e6',  noteColor: '#fb7185',  strokeColor: 'rgba(136,19,55,0.95)',  textShadow: 'rgba(136,19,55,0.6)' },
            'lemon-pop':        { fillColor: '#fef9c3',  noteColor: '#fde047',  strokeColor: 'rgba(30,58,138,0.96)',  textShadow: 'rgba(30,58,138,0.6)' },
            'midnight-aqua':    { fillColor: '#99f6e4',  noteColor: '#2dd4bf',  strokeColor: 'rgba(15,23,42,0.97)',   textShadow: 'rgba(0,0,0,0.75)' },
            'peach-fizz':       { fillColor: '#ffedd5',  noteColor: '#fdba74',  strokeColor: 'rgba(124,29,29,0.96)',  textShadow: 'rgba(124,29,29,0.6)' },
            'festival-red':     { fillColor: '#fca5a5',  noteColor: '#f87171',  strokeColor: 'rgba(17,24,39,0.97)',   textShadow: 'rgba(17,24,39,0.7)' },
            'rose-gold':        { fillColor: '#f8b4a6',  noteColor: '#fda4af',  strokeColor: 'rgba(91,52,46,0.96)',   textShadow: 'rgba(91,52,46,0.6)' },
            'cyber-teal':       { fillColor: '#ccfbf1',  noteColor: '#5eead4',  strokeColor: 'rgba(15,39,64,0.97)',   textShadow: 'rgba(15,39,64,0.7)' },
            'aurora-dream':     { fillColor: '#e9d5ff',  noteColor: '#c084fc',  strokeColor: 'rgba(76,29,149,0.97)',  textShadow: 'rgba(76,29,149,0.7)' },
            'coral-soda':       { fillColor: '#ffe4e6',  noteColor: '#fb7185',  strokeColor: 'rgba(127,29,29,0.96)',  textShadow: 'rgba(127,29,29,0.6)' },
            'platinum-pop':     { fillColor: '#e2e8f0',  noteColor: '#cbd5e1',  strokeColor: 'rgba(15,23,42,0.97)',   textShadow: 'rgba(0,0,0,0.75)' },
            'champagne-shine':  { fillColor: '#f8e7b5',  noteColor: '#fde68a',  strokeColor: 'rgba(107,79,42,0.96)',  textShadow: 'rgba(107,79,42,0.6)' },
            'royal-velvet':     { fillColor: '#d8b4fe',  noteColor: '#c084fc',  strokeColor: 'rgba(49,46,129,0.97)',  textShadow: 'rgba(49,46,129,0.7)' },
            'emerald-luxe':     { fillColor: '#d1fae5',  noteColor: '#a7f3d0',  strokeColor: 'rgba(20,83,45,0.96)',   textShadow: 'rgba(20,83,45,0.6)' },
            'sunrise-opal':     { fillColor: '#ffedd5',  noteColor: '#fdba74',  strokeColor: 'rgba(154,52,18,0.96)',  textShadow: 'rgba(154,52,18,0.6)' },
            'prism-burst':      { fillColor: '#bfdbfe',  noteColor: '#7dd3fc',  strokeColor: 'rgba(67,56,202,0.97)',  textShadow: 'rgba(67,56,202,0.7)' },
            'tropical-punch':   { fillColor: '#ffe4e6',  noteColor: '#fb7185',  strokeColor: 'rgba(127,29,29,0.96)',  textShadow: 'rgba(127,29,29,0.6)' },
            'lagoon-shine':     { fillColor: '#ccfbf1',  noteColor: '#2dd4bf',  strokeColor: 'rgba(21,94,117,0.96)',  textShadow: 'rgba(21,94,117,0.6)' },
            'berry-mist':       { fillColor: '#fce7f3',  noteColor: '#f472b6',  strokeColor: 'rgba(112,26,117,0.96)', textShadow: 'rgba(112,26,117,0.6)' },
            'polar-neon':       { fillColor: '#cffafe',  noteColor: '#67e8f9',  strokeColor: 'rgba(30,41,59,0.97)',   textShadow: 'rgba(30,41,59,0.7)' },
            'citrus-splash':    { fillColor: '#ecfccb',  noteColor: '#bef264',  strokeColor: 'rgba(54,83,20,0.96)',   textShadow: 'rgba(54,83,20,0.6)' }
        };

        function applyAppearance(appearance) {
            if (!appearance) return;
            const fontKey = String(appearance.fontKey || 'default').trim().toLowerCase();
            const textStyleKey = String(appearance.textStyleKey || 'gold-night').trim().toLowerCase();
            const strokeWidth = Math.max(0, Math.min(24, Number(appearance.strokeWidth) || 6));
            const fontFamily = CAPTION_FONT_FAMILIES[fontKey] || CAPTION_FONT_FAMILIES.default;
            const textStyle = CAPTION_TEXT_STYLES[textStyleKey] || CAPTION_TEXT_STYLES['gold-night'];
            const root = document.documentElement.style;
            root.setProperty('--widget-font-family', fontFamily);
            root.setProperty('--caption-fill', textStyle.fillColor);
            root.setProperty('--caption-note', textStyle.noteColor);
            root.setProperty('--caption-stroke', textStyle.strokeColor);
            root.setProperty('--caption-shadow', textStyle.textShadow);
            root.setProperty('--caption-stroke-width', strokeWidth + 'px');
        }

        function applySettings(settings) {
            if (!settings) return;
            currentSettings = settings;

            if (typeof settings.fontSize === 'number') {
                document.documentElement.style.setProperty('--font-size', settings.fontSize + 'px');
            }
            if (typeof settings.verticalOffset === 'number') {
                document.documentElement.style.setProperty('--caption-bottom', settings.verticalOffset + 'px');
            }

            const bgParam = params.get('bg');
            const effective = bgParam !== null ? bgParam : (settings.bgStyle || 'transparent');
            document.body.classList.toggle('bg-semi', effective === 'semi');
        }

        function elKey(el) {
            return el === originalEl ? 'original' : 'translated';
        }

        function showInstant(el, text, extraClass) {
            const key = elKey(el);
            clearInterval(twTimer[key]);
            twTimer[key] = null;
            if (!text) { el.classList.remove('slide-in'); el.classList.add('hidden'); el.textContent = ''; return; }
            el.textContent = text;
            el.classList.remove('hidden', 'slide-in', 'interim');
            if (extraClass) el.classList.add(extraClass);
            void el.offsetWidth;
            el.classList.add('slide-in');
        }

        function showTypewriter(el, text, extraClass, charsPerSec) {
            const key = elKey(el);
            clearInterval(twTimer[key]);
            twTimer[key] = null;
            if (!text) { el.classList.remove('slide-in'); el.classList.add('hidden'); el.textContent = ''; return; }
            el.textContent = '';
            el.classList.remove('hidden', 'slide-in', 'interim');
            if (extraClass) el.classList.add(extraClass);
            void el.offsetWidth;
            el.classList.add('slide-in');
            let i = 0;
            const interval = Math.max(17, Math.round(1000 / charsPerSec));
            twTimer[key] = setInterval(() => {
                i++;
                el.textContent = text.slice(0, i);
                if (i >= text.length) { clearInterval(twTimer[key]); twTimer[key] = null; }
            }, interval);
        }

        function setText(el, text, extraClass) {
            const cps = currentSettings.charsPerSec ?? 12;
            // showInterim=false means text waits for silence then appears all at once
            if (cps >= 60 || !currentSettings.showInterim) {
                showInstant(el, text, extraClass);
            } else {
                showTypewriter(el, text, extraClass, cps);
            }
        }

        let segmentQueue = [];

        function hideAll() {
            originalEl.classList.remove('slide-in');
            translatedEl.classList.remove('slide-in');
            originalEl.classList.add('hidden');
            translatedEl.classList.add('hidden');
        }

        function showSegment(origChunk, translatedText) {
            setText(originalEl, origChunk, '');
            setText(translatedEl, translatedText || '');
            clearTimeout(hideTimer);
            const ms = (currentSettings.segmentDuration ?? 6) * 1000;
            hideTimer = setTimeout(() => {
                if (segmentQueue.length > 0) {
                    const next = segmentQueue.shift();
                    showSegment(next.orig, next.trans);
                } else {
                    hideAll();
                }
            }, ms);
        }

        const jaSegmenter = typeof Intl?.Segmenter === 'function'
            ? new Intl.Segmenter('ja', { granularity: 'word' })
            : null;

        function splitIntoSegments(text, maxChars) {
            const strongBreak = /[。！？]/;
            const weakBreak   = /[、，,]/;
            const punctOnly   = /^[\s。！？、，,・…〜～]+$/;
            const result = [];
            let rem = text;
            while (rem.length > 0) {
                if (rem.length <= maxChars) { result.push(rem); break; }
                let cut = -1;
                // 後半50%の範囲のみ検索 — 前半の孤立した句読点で短い塊を生まない
                const minPunct = Math.ceil(maxChars * 0.5);
                for (let i = maxChars - 1; i >= minPunct; i--) {
                    if (strongBreak.test(rem[i])) { cut = i + 1; break; }
                }
                if (cut < 0) {
                    for (let i = maxChars - 1; i >= minPunct; i--) {
                        if (weakBreak.test(rem[i])) { cut = i + 1; break; }
                    }
                }
                if (cut < 0) {
                    for (let i = maxChars - 1; i > 0; i--) {
                        if (rem[i] === ' ') { cut = i; break; }
                    }
                }
                // 単語境界でカット（カタカナ語・漢語がmaxChars付近でぶつ切りになるのを防ぐ）
                if (cut < 0 && jaSegmenter) {
                    const probe = rem.slice(0, maxChars + 10);
                    let pos = 0;
                    let lastBound = -1;
                    for (const seg of jaSegmenter.segment(probe)) {
                        pos += seg.segment.length;
                        if (pos <= maxChars) lastBound = pos;
                        else break;
                    }
                    if (lastBound > 1) cut = lastBound;
                }
                if (cut < 0) cut = maxChars;
                result.push(rem.slice(0, cut));
                rem = rem.slice(cut).trimStart();
            }
            // Merge punctuation-only chunks into previous
            const merged = [];
            for (const chunk of result) {
                if (merged.length > 0 && punctOnly.test(chunk)) {
                    merged[merged.length - 1] += chunk;
                } else {
                    merged.push(chunk);
                }
            }
            return merged.filter(c => c.trim().length > 0);
        }

        function enqueueSegments(originalText, translatedText) {
            clearTimeout(hideTimer);
            segmentQueue = [];
            const maxChars = currentSettings.maxCharsPerSegment ?? 20;
            const chunks = splitIntoSegments(originalText, maxChars);
            if (chunks.length === 0) return;
            for (let i = 1; i < chunks.length; i++) {
                segmentQueue.push({ orig: chunks[i], trans: null });
            }
            showSegment(chunks[0], translatedText);
        }

        socket.on('widgets:caption:updated', (payload) => {
            if (!payload) return;

            if (payload.settings) applySettings(payload.settings);

            const showInterim = currentSettings.showInterim !== false;
            const isFinal = Boolean(payload.isFinal);

            if (!isFinal && !showInterim) return;

            if (!isFinal) {
                // Interim: show directly, no segmentation
                setText(originalEl, payload.original || '', 'interim');
                setText(translatedEl, '');
                clearTimeout(hideTimer);
                hideTimer = setTimeout(hideAll, (currentSettings.segmentDuration ?? 6) * 1000);
                return;
            }

            const showTranslation = currentSettings.translationEnabled && payload.translated;
            enqueueSegments(payload.original || '', showTranslation ? payload.translated : null);
        });

        socket.on('widgets:caption:translation', ({ translated } = {}) => {
            if (translated) setText(translatedEl, translated);
        });

        socket.on('widgets:caption:config', (payload) => {
            if (payload?.settings) applySettings(payload.settings);
            if (payload?.appearance) applyAppearance(payload.appearance);
        });

        socket.on('connect', () => {
            fetch('/api/widgets/caption/config')
                .then((r) => r.json())
                .then((p) => { if (p?.settings) applySettings(p.settings); if (p?.appearance) applyAppearance(p.appearance); })
                .catch(() => {});
        });
    </script>
</body>
</html>
