<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タップ数一覧</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap');

        :root {
            --bg: transparent;
            --row-bg: rgba(0, 0, 0, 0.52);
            --name-color: #f1f5f9;
            --count-color: #fbbf24;
            --rank-color: rgba(241, 245, 249, 0.55);
            --stroke: rgba(15, 23, 42, 0.96);
            --shadow: rgba(15, 23, 42, 0.36);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            min-height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: "M PLUS Rounded 1c", sans-serif;
        }

        body.bg-semi {
            --bg: rgba(0, 0, 0, 0.72);
        }

        .widget {
            padding: 14px 16px;
            width: max-content;
            min-width: 220px;
            max-width: min(400px, 100vw);
            pointer-events: none;
        }

        .header {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.06em;
            color: rgba(251, 191, 36, 0.80);
            -webkit-text-stroke: 3px var(--stroke);
            paint-order: stroke fill;
            text-shadow: 0 4px 12px var(--shadow);
            margin-bottom: 8px;
            padding-left: 4px;
            text-transform: uppercase;
        }

        .list {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px 6px 8px;
            border-radius: 10px;
            background: var(--row-bg);
            border: 1px solid rgba(255, 255, 255, 0.10);
            animation: rowIn 320ms cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .rank {
            font-size: 12px;
            font-weight: 900;
            color: var(--rank-color);
            min-width: 20px;
            text-align: right;
            flex-shrink: 0;
        }

        .rank.top1 { color: #fbbf24; font-size: 14px; }
        .rank.top2 { color: #94a3b8; }
        .rank.top3 { color: #c77d47; }

        .name {
            font-size: 16px;
            font-weight: 800;
            color: var(--name-color);
            -webkit-text-stroke: 3.5px var(--stroke);
            paint-order: stroke fill;
            text-shadow: 0 4px 12px var(--shadow);
            flex: 1 1 0;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .count {
            font-size: 18px;
            font-weight: 900;
            color: var(--count-color);
            -webkit-text-stroke: 4px var(--stroke);
            paint-order: stroke fill;
            text-shadow: 0 6px 16px var(--shadow);
            flex-shrink: 0;
        }

        .empty {
            font-size: 13px;
            color: rgba(241, 245, 249, 0.45);
            padding: 8px 4px;
        }

        @keyframes rowIn {
            from { opacity: 0; transform: translateX(-12px); }
            to   { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>
    <div class="widget" id="widget">
        <div class="header" id="header">タップ数</div>
        <div class="list" id="list">
            <div class="empty">データなし</div>
        </div>
    </div>

    <script>
        const socket = io();
        const searchParams = new URLSearchParams(window.location.search);
        const listEl = document.getElementById('list');

        // URL パラメータで初期背景を適用（サーバー設定より優先）
        const bgParam = searchParams.get('bg');
        if (bgParam === 'semi') {
            document.body.classList.add('bg-semi');
        }

        function applyBgStyle(bgStyle) {
            // URL パラメータが指定されている場合はそちらを優先
            const effective = bgParam !== null ? bgParam : bgStyle;
            document.body.classList.toggle('bg-semi', effective === 'semi');
        }

        function render(entries) {
            if (!Array.isArray(entries) || entries.length === 0) {
                listEl.innerHTML = '<div class="empty">データなし</div>';
                return;
            }

            listEl.innerHTML = entries.map((e) => {
                const rankClass = e.rank === 1 ? 'top1' : e.rank === 2 ? 'top2' : e.rank === 3 ? 'top3' : '';
                const rankLabel = e.rank === 1 ? '🥇' : e.rank === 2 ? '🥈' : e.rank === 3 ? '🥉' : `${e.rank}`;
                return `<div class="row">
                    <span class="rank ${rankClass}">${rankLabel}</span>
                    <span class="name">${escapeHtml(e.nickname)}</span>
                    <span class="count">${e.tapCount.toLocaleString()}</span>
                </div>`;
            }).join('');
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function applyPayload(payload) {
            if (!payload) return;
            if (payload.settings) applyBgStyle(payload.settings.bgStyle);
            render(payload.entries || []);
        }

        socket.on('connect', () => {
            fetch('/api/widgets/tap-list/config')
                .then((r) => r.json())
                .then(applyPayload)
                .catch(() => {});
        });

        socket.on('widgets:tap-list:updated', applyPayload);
        socket.on('widgets:tap-list:config', applyPayload);
    </script>
</body>
</html>
