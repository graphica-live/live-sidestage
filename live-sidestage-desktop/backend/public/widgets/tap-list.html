<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タップ数一覧</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap');

        :root {
            --name-color: #f1f5f9;
            --count-color: #fbbf24;
            --stroke: rgba(15, 23, 42, 0.96);
            --shadow: rgba(15, 23, 42, 0.40);
            --avatar-size: 68px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            min-height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: "M PLUS Rounded 1c", sans-serif;
        }

        .widget {
            padding: 14px 18px;
            width: max-content;
            min-width: 300px;
            max-width: min(520px, 100vw);
            pointer-events: none;
        }

        .list {
            display: flex;
            flex-direction: column;
        }

        .row + .row {
            margin-top: var(--row-gap, 8px);
        }

        /* 透過モード: カード行は背景なし（文字のみ） */
        .row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 14px 0 6px;
            border-radius: 16px;
            background: transparent;
            border: 1px solid transparent;
            animation: rowIn 320ms cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        /* 半透過モード: カード行に半透明黒背景 */
        body.bg-semi .row {
            background: rgba(0, 0, 0, 0.52);
            border-color: rgba(255, 255, 255, 0.10);
        }

        /* プロフィール画像 */
        .avatar-wrap {
            flex-shrink: 0;
            width: var(--avatar-size);
            height: var(--avatar-size);
            border-radius: 50%;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .avatar-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            font-size: 26px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.55);
            -webkit-text-stroke: 2px var(--stroke);
            paint-order: stroke fill;
            line-height: 1;
        }

        /* テキスト列（名前 + タップ数の2行） */
        .info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
            flex: 1 1 0;
        }

        .name {
            font-size: 22px;
            font-weight: 800;
            color: var(--name-color);
            -webkit-text-stroke: 5px var(--stroke);
            paint-order: stroke fill;
            text-shadow: 0 4px 14px var(--shadow);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.15;
        }

        .count-row {
            display: flex;
            align-items: center;
            gap: 6px;
            line-height: 1.15;
        }

        /* SVGハート（絵文字非使用） */
        .heart-icon {
            flex-shrink: 0;
            width: 20px;
            height: 20px;
        }

        .count {
            font-size: 24px;
            font-weight: 900;
            color: var(--count-color);
            -webkit-text-stroke: 5px var(--stroke);
            paint-order: stroke fill;
            text-shadow: 0 5px 16px var(--shadow);
        }

        .empty {
            font-size: 16px;
            color: rgba(241, 245, 249, 0.45);
            padding: 10px 6px;
        }

        @keyframes rowIn {
            from { opacity: 0; transform: translateX(-14px); }
            to   { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>
    <div class="widget" id="widget">
        <div class="list" id="list">
            <div class="empty">データなし</div>
        </div>
    </div>

    <script>
        const HEART_SVG = `<svg class="heart-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">` +
            `<path d="M12 21C12 21 3 13.5 3 8a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 5.5-9 13-9 13z" ` +
            `fill="#f87171" stroke="rgba(15,23,42,0.9)" stroke-width="1.5" stroke-linejoin="round"/>` +
            `</svg>`;

        const socket = io();
        const searchParams = new URLSearchParams(window.location.search);
        const listEl = document.getElementById('list');

        const bgParam = searchParams.get('bg');
        if (bgParam === 'semi') {
            document.body.classList.add('bg-semi');
        }

        function applyBgStyle(bgStyle) {
            const effective = bgParam !== null ? bgParam : bgStyle;
            document.body.classList.toggle('bg-semi', effective === 'semi');
        }

        function applyRowGap(rowGap) {
            const gap = typeof rowGap === 'number' ? rowGap : 8;
            document.documentElement.style.setProperty('--row-gap', gap + 'px');
        }

        function buildAvatarHtml(avatarUrl, nickname) {
            const letter = escapeHtml(String(nickname || '?').charAt(0).toUpperCase());
            if (avatarUrl) {
                const proxied = `/api/proxy/avatar?url=${encodeURIComponent(avatarUrl)}`;
                return `<div class="avatar-wrap">` +
                    `<img src="${escapeAttr(proxied)}" alt="" ` +
                    `onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` +
                    `<span class="avatar-placeholder" style="display:none">${letter}</span>` +
                    `</div>`;
            }
            return `<div class="avatar-wrap"><span class="avatar-placeholder">${letter}</span></div>`;
        }

        function render(entries) {
            if (!Array.isArray(entries) || entries.length === 0) {
                listEl.innerHTML = '<div class="empty">データなし</div>';
                return;
            }

            listEl.innerHTML = entries.map((e) => {
                return `<div class="row">
                    ${buildAvatarHtml(e.avatarUrl, e.nickname)}
                    <div class="info">
                        <span class="name">${escapeHtml(e.nickname)}</span>
                        <div class="count-row">
                            ${HEART_SVG}
                            <span class="count">${e.tapCount.toLocaleString()}</span>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function escapeAttr(s) {
            return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function applyPayload(payload) {
            if (!payload) return;
            if (payload.settings) {
                applyBgStyle(payload.settings.bgStyle);
                applyRowGap(payload.settings.rowGap);
            }
            render(payload.entries || []);
        }

        socket.on('connect', () => {
            fetch('/api/widgets/tap-list/config')
                .then((r) => r.json())
                .then(applyPayload)
                .catch(() => {});
        });

        socket.on('widgets:tap-list:updated', applyPayload);
        socket.on('widgets:tap-list:config', applyPayload);
    </script>
</body>
</html>
