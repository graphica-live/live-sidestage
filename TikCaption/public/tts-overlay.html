<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
html, body {
  background: transparent;
  margin: 0;
  overflow: hidden;
}

#voicevox-credit {
  position: fixed;
  bottom: 12px;
  right: 16px;
  font-family: -apple-system, "Yu Gothic UI", "Hiragino Sans", sans-serif;
  font-size: 20px;
  color: rgba(255,255,255,1);
  background: rgba(0,0,0,0.45);
  padding: 5px 12px;
  border-radius: 4px;
  pointer-events: none;
  transition: opacity 0.5s;
  opacity: 0;
}
#voicevox-credit.show { opacity: 1; }
</style>
</head>
<body>
<div id="voicevox-credit"></div>
<script src="http://localhost:38200/socket.io/socket.io.js"></script>
<script>
const socket = io('http://localhost:38200');
const credit = document.getElementById('voicevox-credit');
let creditTimer = null;
let audioCtx = null;

socket.on('tts:playing', ({ voiceName }) => {
  credit.textContent = `VOICEVOX:${voiceName}`;
  credit.classList.add('show');
  clearTimeout(creditTimer);
  creditTimer = setTimeout(() => credit.classList.remove('show'), 4000);
});

socket.on('tts:speak', async ({ text, speakerId, volume }) => {
  try {
    const qRes = await fetch(
      `http://localhost:50021/audio_query?speaker=${speakerId}&text=${encodeURIComponent(text)}`,
      { method: 'POST' }
    );
    if (!qRes.ok) throw new Error('audio_query failed');
    const query = await qRes.json();
    query.volumeScale = volume ?? 0.8;
    const aRes = await fetch(
      `http://localhost:50021/synthesis?speaker=${speakerId}`,
      { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(query) }
    );
    if (!aRes.ok) throw new Error('synthesis failed');
    const buf = await aRes.arrayBuffer();
    if (!audioCtx) audioCtx = new AudioContext();
    const decoded = await audioCtx.decodeAudioData(buf);
    await new Promise(resolve => {
      const src = audioCtx.createBufferSource();
      src.buffer = decoded;
      src.connect(audioCtx.destination);
      src.onended = resolve;
      src.start();
    });
  } catch (e) {
    console.warn('[TTS overlay]', e.message);
  } finally {
    socket.emit('tts:done', {});
  }
});
</script>
</body>
</html>
