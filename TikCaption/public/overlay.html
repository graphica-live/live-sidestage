<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
html, body {
  background: transparent;
  margin: 0;
  overflow: hidden;
}

:root {
  --font-family: "M PLUS Rounded 1c", sans-serif;
  --font-size: 52px;
  --fill-color: #ffffff;
  --note-color: #fde68a;
  --stroke-color: rgba(10,10,20,0.95);
  --stroke-width: 6px;
  --shadow-color: rgba(0,0,0,0.7);
  --bottom-offset: 120px;
}

#wrap {
  position: fixed;
  bottom: var(--bottom-offset);
  left: 0; right: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 40px;
  pointer-events: none;
  transition: background 0.2s, padding 0.2s;
}

#original {
  font-family: var(--font-family);
  font-size: var(--font-size);
  font-weight: 900;
  color: var(--fill-color);
  -webkit-text-stroke: var(--stroke-width) var(--stroke-color);
  paint-order: stroke fill;
  text-shadow: 0 0 20px var(--shadow-color), 0 3px 12px rgba(0,0,0,.5);
  text-align: center;
  word-break: break-all;
  line-height: 1.2;
  opacity: 1;
  transition: opacity 0.5s;
}

#translated {
  font-family: var(--font-family);
  font-size: calc(var(--font-size) * 0.72);
  font-weight: 800;
  color: var(--note-color);
  -webkit-text-stroke: calc(var(--stroke-width) - 1px) var(--stroke-color);
  paint-order: stroke fill;
  text-align: center;
  word-break: break-word;
  line-height: 1.3;
  opacity: 1;
  transition: opacity 0.5s;
}

body.bg-semi #wrap {
  background: rgba(0,0,0,0.54);
  border-radius: 12px;
  padding: 8px 24px;
  backdrop-filter: blur(4px);
}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@900&family=Noto+Sans+JP:wght@900&family=Noto+Serif+JP:wght@900&family=Zen+Kaku+Gothic+New:wght@900&family=Kosugi&family=Klee+One:wght@600&family=Zen+Maru+Gothic:wght@900&family=Dela+Gothic+One&family=Hachi+Maru+Pop&family=RocknRoll+One&display=swap" rel="stylesheet">
</head>
<body>
<div id="wrap">
  <div id="translated"></div>
  <div id="original"></div>
</div>

<script src="http://localhost:38200/socket.io/socket.io.js"></script>
<script>
const TEXT_STYLES = {
  'gold-night':     { fill: '#ffffff', note: '#fde68a', stroke: 'rgba(10,10,20,.95)' },
  'ice-night':      { fill: '#dbeafe', note: '#bfdbfe', stroke: 'rgba(23,37,84,.95)' },
  'candy-pop':      { fill: '#ffe4f1', note: '#fbcfe8', stroke: 'rgba(131,24,67,.95)' },
  'mint-lime':      { fill: '#d1fae5', note: '#6ee7b7', stroke: 'rgba(6,78,59,.96)' },
  'sunset-party':   { fill: '#fed7aa', note: '#fb923c', stroke: 'rgba(120,53,15,.96)' },
  'violet-flash':   { fill: '#e9d5ff', note: '#c084fc', stroke: 'rgba(59,7,100,.96)' },
  'mono-impact':    { fill: '#f8fafc', note: '#e2e8f0', stroke: 'rgba(2,6,23,.97)' },
  'sakura-bloom':   { fill: '#ffe4e6', note: '#fda4af', stroke: 'rgba(136,19,55,.95)' },
};

const root = document.documentElement;
const elOriginal = document.getElementById('original');
const elTranslated = document.getElementById('translated');

let settings = {
  showOriginal: true,
  translationEnabled: false,
  fontSize: 52,
  verticalOffset: 120,
  segmentDuration: 6,
  maxCharsPerSegment: 20,
  charsPerSec: 12,
  showInterim: false,
  bgStyle: 'transparent',
  fontFamily: 'M PLUS Rounded 1c',
  textStyleKey: 'gold-night',
  strokeWidth: 6,
};

let fadeTimer = null;
let typeTimer = null;
let processTimer = null;
let captionQueue = [];
let isTyping = false;

function applySettings(s) {
  Object.assign(settings, s);

  root.style.setProperty('--font-size', settings.fontSize + 'px');
  root.style.setProperty('--bottom-offset', settings.verticalOffset + 'px');
  root.style.setProperty('--font-family', `"${settings.fontFamily}", sans-serif`);
  root.style.setProperty('--stroke-width', settings.strokeWidth + 'px');

  const theme = TEXT_STYLES[settings.textStyleKey] || TEXT_STYLES['gold-night'];
  root.style.setProperty('--fill-color', theme.fill);
  root.style.setProperty('--note-color', theme.note);
  root.style.setProperty('--stroke-color', theme.stroke);

  document.body.classList.toggle('bg-semi', settings.bgStyle === 'semi');

  elOriginal.style.display = settings.showOriginal ? '' : 'none';
  elTranslated.style.display = settings.translationEnabled ? '' : 'none';
}

function splitText(text) {
  const maxLen = settings.maxCharsPerSegment;
  if (text.length <= maxLen) return [text];

  const segments = [];
  let cur = '';
  for (let i = 0; i < text.length; i++) {
    cur += text[i];
    const isPunct = '。！？、，'.includes(text[i]);
    if (cur.length >= maxLen || (isPunct && cur.length > 0)) {
      segments.push(cur);
      cur = '';
    }
  }
  if (cur) segments.push(cur);
  return segments;
}

function clearFade() {
  if (fadeTimer) { clearTimeout(fadeTimer); fadeTimer = null; }
  if (typeTimer) { clearInterval(typeTimer); typeTimer = null; }
  if (processTimer) { clearTimeout(processTimer); processTimer = null; }
}

function startFadeTimer() {
  clearTimeout(fadeTimer);
  fadeTimer = setTimeout(() => {
    elOriginal.style.opacity = '0';
    elTranslated.style.opacity = '0';
  }, settings.segmentDuration * 1000);
}

function typewriterDisplay(text, onDone) {
  elOriginal.style.opacity = '1';
  const current = elOriginal.textContent || '';
  let i = (text.startsWith(current) && current.length > 0) ? current.length : 0;
  if (i === 0) elOriginal.textContent = '';
  if (i >= text.length) { if (onDone) onDone(); return; }
  const delay = settings.charsPerSec > 0 ? 1000 / settings.charsPerSec : 16;
  typeTimer = setInterval(() => {
    elOriginal.textContent = text.slice(0, ++i);
    if (i >= text.length) {
      clearInterval(typeTimer);
      typeTimer = null;
      if (onDone) onDone();
    }
  }, delay);
}

function processQueue() {
  if (captionQueue.length === 0) { isTyping = false; return; }
  isTyping = true;
  const seg = captionQueue.shift();

  clearFade();
  elTranslated.textContent = '';
  elOriginal.style.opacity = '1';

  if (settings.charsPerSec >= 60) {
    elOriginal.textContent = seg;
    startFadeTimer();
    processTimer = setTimeout(processQueue, settings.segmentDuration * 1000);
  } else {
    typewriterDisplay(seg, () => {
      startFadeTimer();
      processTimer = setTimeout(processQueue, settings.segmentDuration * 1000);
    });
  }
}

function showText(original, translated, isFinal) {
  if (!isFinal) {
    if (!settings.showInterim) return;
    clearFade();
    if (typeTimer) { clearInterval(typeTimer); typeTimer = null; }
    elOriginal.style.opacity = '0.5';
    elOriginal.textContent = original;
    if (settings.translationEnabled) elTranslated.style.opacity = '1';
    return;
  }

  // final — queue segments
  clearFade();
  captionQueue = [];
  isTyping = false;

  const segs = splitText(original);
  captionQueue.push(...segs);
  processQueue();
}

const socket = io('http://localhost:38200');

socket.on('connect', () => {
  fetch('http://localhost:38200/api/caption/config')
    .then(r => r.json())
    .then(applySettings)
    .catch(() => {});
});

socket.on('caption:updated', ({ original, translated, isFinal, settings: s }) => {
  if (s) applySettings(s);
  showText(original, translated, isFinal);
});

socket.on('caption:translation', ({ translated }) => {
  if (!settings.translationEnabled) return;
  elOriginal.style.opacity = '1';
  elTranslated.style.opacity = '1';
  elTranslated.textContent = translated;
  startFadeTimer();
});

socket.on('caption:config', (s) => {
  applySettings(s);
});
</script>
</body>
</html>
