services:
  db:
    image: postgres:16-alpine
    container_name: liveanalytics-local-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: liveanalytics
      POSTGRES_PASSWORD: liveanalytics
      POSTGRES_DB: liveanalytics_test
    ports:
      - "5433:5432"
    volumes:
      - liveanalytics-local-db:/var/lib/postgresql/data

volumes:
  liveanalytics-local-db:
